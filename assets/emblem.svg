<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Mingjian silicon-crystal emblem">
  <title>Mingjian — the silicon-crystal lobster emblem</title>
  <!-- outer disc -->
  <circle cx="100" cy="100" r="96" fill="#9A3322"/>
  <!-- crystal facet lines on disc -->
  <g stroke="#F5F1E8" stroke-width="1" opacity="0.18" fill="none">
    <path d="M 100 4 L 100 196"/>
    <path d="M 4 100 L 196 100"/>
    <path d="M 32 32 L 168 168"/>
    <path d="M 168 32 L 32 168"/>
  </g>
  <!-- subtle inner ring -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#F5F1E8" stroke-width="2" opacity="0.35"/>
  <!-- simplified lobster silhouette (cream) -->
  <g fill="#F5F1E8">
    <!-- shadow under -->
    <ellipse cx="100" cy="160" rx="40" ry="3.5" opacity="0.25" fill="#000"/>
    <!-- antennae -->
    <path d="M 90 60 C 80 48 70 38 60 26" stroke="#F5F1E8" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 110 60 C 120 48 130 38 140 26" stroke="#F5F1E8" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="60" cy="26" r="3"/>
    <circle cx="140" cy="26" r="3"/>
    <!-- body -->
    <ellipse cx="100" cy="118" rx="38" ry="48"/>
    <!-- head -->
    <ellipse cx="100" cy="64" rx="32" ry="24"/>
    <!-- claws -->
    <path d="M 70 92 C 48 86 32 96 26 110 C 22 120 28 128 38 130 C 48 130 58 124 64 116 C 70 108 74 100 72 96 Z"/>
    <path d="M 130 92 C 152 86 168 96 174 110 C 178 120 172 128 162 130 C 152 130 142 124 136 116 C 130 108 126 100 128 96 Z"/>
  </g>
  <!-- crystal facets cut into the lobster body -->
  <g stroke="#9A3322" stroke-width="1.1" fill="none" opacity="0.75">
    <path d="M 78 96 L 100 84 L 122 96"/>
    <path d="M 84 132 L 100 118 L 116 132"/>
    <path d="M 100 84 L 100 150"/>
  </g>
  <!-- circuit node on body -->
  <circle cx="100" cy="130" r="2.2" fill="#C8442A"/>
  <circle cx="100" cy="106" r="2.2" fill="#C8442A"/>
  <!-- eyes (dark for contrast) -->
  <circle cx="89" cy="60" r="4" fill="#2a241d"/>
  <circle cx="111" cy="60" r="4" fill="#2a241d"/>
  <circle cx="90" cy="59" r="1.2" fill="#F5F1E8"/>
  <circle cx="112" cy="59" r="1.2" fill="#F5F1E8"/>
  <!-- smile -->
  <path d="M 92 76 C 96 80 104 80 108 76" stroke="#2a241d" stroke-width="1.6" fill="none" stroke-linecap="round"/>
</svg>
