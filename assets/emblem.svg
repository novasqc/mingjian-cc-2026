<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Mingjian silicon-crystal lobster emblem">
  <title>Mingjian — the silicon-crystal lobster emblem</title>
  <!-- outer disc -->
  <circle cx="100" cy="100" r="96" fill="#9A3322"/>
  <!-- inner ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#F5F1E8" stroke-width="2" opacity="0.4"/>

  <!-- lobster (bold cream silhouette, top-down) -->
  <g fill="#F5F1E8">
    <!-- antennae -->
    <path d="M 90 44 C 80 34 70 26 60 20" stroke="#F5F1E8" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 110 44 C 120 34 130 26 140 20" stroke="#F5F1E8" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="60" cy="20" r="2.5"/>
    <circle cx="140" cy="20" r="2.5"/>

    <!-- arms connecting claws to body -->
    <path d="M 56 64 L 72 78" stroke="#F5F1E8" stroke-width="8" stroke-linecap="round"/>
    <path d="M 144 64 L 128 78" stroke="#F5F1E8" stroke-width="8" stroke-linecap="round"/>

    <!-- claws: filled circles with open-pincer notch -->
    <circle cx="44" cy="56" r="17"/>
    <polygon points="44,56 20,38 28,64" fill="#9A3322"/>
    <circle cx="156" cy="56" r="17"/>
    <polygon points="156,56 180,38 172,64" fill="#9A3322"/>

    <!-- head -->
    <ellipse cx="100" cy="72" rx="28" ry="20"/>
    <!-- carapace -->
    <ellipse cx="100" cy="104" rx="33" ry="24"/>
    <!-- segmented abdomen (tapering) -->
    <ellipse cx="100" cy="126" rx="24" ry="10"/>
    <ellipse cx="100" cy="138" rx="20" ry="9"/>
    <ellipse cx="100" cy="148" rx="16" ry="8"/>

    <!-- tail fan: one wide flat fan, clearly wider than the body -->
    <path d="M 78 148 Q 62 152 58 166 Q 100 176 142 166 Q 138 152 122 148 Q 100 156 78 148 Z"/>
  </g>

  <!-- tail-fan segment lines -->
  <g stroke="#9A3322" stroke-width="1.1" opacity="0.5">
    <line x1="100" y1="150" x2="100" y2="170"/>
    <line x1="100" y1="150" x2="72" y2="162"/>
    <line x1="100" y1="150" x2="128" y2="162"/>
  </g>

  <!-- crystal facets on carapace -->
  <g stroke="#9A3322" stroke-width="1.1" fill="none" opacity="0.5">
    <line x1="82" y1="98" x2="118" y2="98"/>
    <line x1="100" y1="86" x2="100" y2="118"/>
    <line x1="86" y1="110" x2="114" y2="110"/>
  </g>
  <circle cx="100" cy="98" r="2.4" fill="#C8442A"/>
  <circle cx="100" cy="110" r="2.4" fill="#C8442A"/>

  <!-- eyes -->
  <circle cx="90" cy="66" r="4.2" fill="#2a241d"/>
  <circle cx="110" cy="66" r="4.2" fill="#2a241d"/>
  <circle cx="91" cy="65" r="1.3" fill="#F5F1E8"/>
  <circle cx="111" cy="65" r="1.3" fill="#F5F1E8"/>
  <!-- smile -->
  <path d="M 94 78 C 97 81 103 81 106 78" stroke="#2a241d" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
